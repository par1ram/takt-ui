name: Catalog CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catalog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Verify the production catalog and search metadata
        run: |
          bun run start --port 3100 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --output /dev/null --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3100/
          node scripts/check-seo.mjs http://127.0.0.1:3100
